<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵台 · 斜月</title>
<meta name="description" content="灵台方寸山，斜月三星洞。手扎、灵蕴、神通、影神图、心猿。">
<style>
  :root{
    --bg:#0a0a0b; --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.26);
    --ink:#f5f5f5; --ink2:#b8b8b8; --muted:#6b6b70;
    --red:#e64545; --red2:#ff5f5f;
    --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Consolas,monospace;
    --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai",STKaiti,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15.5px/1.8 -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
  /* 背景：静态网格 + 灰白光晕 + 单色光粒 */
  .gridbg{position:fixed;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 78%);
            mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 78%);}
  .orb{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none}
  .orb.a{width:560px;height:560px;top:-200px;left:-140px;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%)}
  .orb.b{width:480px;height:480px;top:-120px;right:-160px;background:radial-gradient(circle,rgba(255,255,255,.05),transparent 70%)}
  canvas#fbg{position:fixed;inset:0;pointer-events:none}
  /* 全屏纵向布局：nav / 居中题字 / 页脚 */
  .wrap{position:relative;max-width:900px;margin:0 auto;padding:0 24px;min-height:100vh;display:flex;flex-direction:column}
  /* 山门 */
  nav{flex:none;display:flex;align-items:center;gap:4px;padding:24px 0 14px;font-family:var(--mono);border-bottom:1px solid var(--line)}
  .logo{font-size:20px;font-weight:900;letter-spacing:5px;color:var(--ink);text-decoration:none;line-height:1}
  .logo i{font-style:normal;color:var(--red);font-size:14px;vertical-align:1px;margin:0 3px}
  /* 灵台·斜月 —— 斜月：楷体、更小、灰色，与"灵台"三种属性全不同 */
  .logo em{font-family:var(--kai);font-style:normal;font-weight:400;font-size:14px;letter-spacing:4px;color:#8b8b92}
  nav .sp{flex:1}
  nav a.lk{color:var(--ink2);text-decoration:none;font-size:13px;padding:5px 13px;border-radius:999px;border:1px solid transparent;letter-spacing:2px;transition:.2s}
  nav a.lk:hover{color:var(--ink);border-color:var(--line2)}
  /* 心跳区：空白点击同一区域 → 心猿浮出 */
  .zone{width:112px;height:38px;border:1px solid transparent;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:default;transition:.3s}
  .zone:hover{background:rgba(255,255,255,.04);border-color:var(--line)}
  .zone .hk{opacity:0;pointer-events:none;transform:translateX(10px);transition:opacity .55s,transform .55s;text-decoration:none;color:var(--muted);font-size:11.5px;letter-spacing:5px;white-space:nowrap}
  .zone.revealed{background:rgba(255,255,255,.05);border-color:var(--line2)}
  .zone.revealed .hk{opacity:.8;pointer-events:auto;transform:none}
  .zone.revealed .hk:hover{color:var(--red2);text-shadow:0 0 18px rgba(230,69,69,.55)}
  /* 题字（垂直居中） */
  header{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6vh 0}
  h1{font-size:clamp(42px,9vw,78px);font-weight:900;letter-spacing:12px;line-height:1.1;color:var(--ink);transition:text-shadow .8s}
  .sub{margin-top:20px;color:var(--ink2);font-size:15px;letter-spacing:2px}
  .typed{margin-top:32px;min-height:1.9em;color:var(--muted);font-size:14px;letter-spacing:4px;font-family:var(--mono)}
  .typed .caret{display:inline-block;width:.5em;height:1.05em;margin-left:2px;background:var(--red);vertical-align:-.15em;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  /* 页脚 */
  footer{flex:none;padding:26px 0 40px;color:var(--muted);font-size:12px;font-family:var(--mono);line-height:2.3;text-align:center;border-top:1px solid var(--line)}
  footer .st{color:var(--ink2)}
  footer .st i{font-style:normal;color:var(--red)}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--ink)}
  .corner{display:inline-block;font-size:11.5px;opacity:.4;letter-spacing:5px;transition:.3s;margin-top:4px}
  .corner:hover{opacity:1;color:var(--red2);text-shadow:0 0 18px rgba(230,69,69,.55)}
</style>
</head>
<body>
<div class="gridbg"></div>
<div class="orb a"></div><div class="orb b"></div>
<canvas id="fbg"></canvas>

<div class="wrap">
  <nav id="nav">
    <a class="logo" href="index.html">灵台<i>·</i><em>斜月</em></a>
    <span class="sp"></span>
    <span class="zone" id="zone" title=""><a class="hk" href="posts/novel/">· 心猿 ·</a></span>
    <a class="lk" href="posts/">手扎</a>
  </nav>

  <header>
    <h1>灵台</h1>
    <p class="sub">灵台方寸山 · 斜月三星洞。</p>
    <div class="typed"><span id="typedTxt"></span><span class="caret"></span></div>
  </header>

  <footer>
    <div class="st">© 2026 灵台 · GitHub Pages · <i>●</i> 灵山不远</div>
    <a class="corner" href="posts/novel/">· 心猿 ·</a>
  </footer>
</div>

<script>
(function(){
  // —— 单色光粒背景 ——
  var cv=document.getElementById('fbg'),ctx=cv.getContext('2d'),w,h;
  var reduced=matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pts=[],rings=[];
  function rs(){w=cv.width=innerWidth;h=cv.height=innerHeight;}
  rs();addEventListener('resize',rs);
  for(var i=0;i<52;i++)pts.push({
    x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    r:Math.random()*1.6+.5,
    vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.22,
    a:Math.random()*.5+.12,
    w:Math.random()<.14
  });
  function tick(){
    ctx.clearRect(0,0,w,h);
    pts.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<-5)p.x=w+5;if(p.x>w+5)p.x=-5;if(p.y<-5)p.y=h+5;if(p.y>h+5)p.y=-5;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);
      ctx.fillStyle=p.w?'rgba(255,255,255,'+Math.min(.95,p.a+.2)+')':'rgba(210,210,215,'+p.a+')';
      ctx.fill();
    });
    // 点击涟漪
    rings=rings.filter(function(r){r.r+=2.6;r.a-=.025;return r.a>0;});
    rings.forEach(function(r){
      ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);
      ctx.strokeStyle='rgba(255,255,255,'+Math.max(0,r.a)+')';
      ctx.lineWidth=1;
      ctx.stroke();
    });
    requestAnimationFrame(tick);
  }
  if(reduced){ctx.clearRect(0,0,w,h);
    pts.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle='rgba(210,210,215,'+p.a+')';ctx.fill();});
  } else requestAnimationFrame(tick);

  // —— 打字机：六根常清净，非是有心猿。——
  var line='六根常清净，非是有心猿。';
  var el=document.getElementById('typedTxt'),ci=0,del=false;
  (function type(){
    el.textContent=line.slice(0,ci);
    if(!del){ci++;if(ci>line.length){del=true;setTimeout(type,3600);return;}setTimeout(type,150);}
    else{if(ci>0){ci--;setTimeout(type,55);}else{del=false;setTimeout(type,900);}}
  })();

  // —— 心跳区：点击同一区域 → 心猿浮出 ——
  document.getElementById('zone').addEventListener('click',function(){
    this.classList.add('revealed');
  });

  // —— 光粒可交互：点击落下一粒 + 涟漪；满 10 粒点亮"灵台" ——
  var glowN=0, h1el=document.querySelector('h1');
  window.addEventListener('click',function(e){
    if(e.target.closest('a,button'))return;          // 链接/按钮点击不算
    pts.push({x:e.clientX,y:e.clientY,r:Math.random()*1.6+2,
      vx:(Math.random()-.5)*.55,vy:(Math.random()-.5)*.45,a:.92,w:true});
    rings.push({x:e.clientX,y:e.clientY,r:5,a:.55});
    if(++glowN>=10){
      var k=Math.min(1,(glowN-9)/14);
      h1el.style.textShadow='0 0 '+(16+26*k)+'px rgba(255,255,255,'+(.15+.3*k)+')'
        +', 0 0 64px rgba(230,69,69,'+(.05+.14*k)+')';
    }
  });
})();
</script>
</body>
</html>
