<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵台 · 方寸间</title>
<meta name="description" content="灵台方寸山，斜月三星洞。见闻录、灵蕴、神通、影神图、心猿。">
<style>
  :root{
    --bg:#0a0a0b; --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.26);
    --ink:#f5f5f5; --ink2:#b8b8b8; --muted:#6b6b70;
    --red:#e64545; --red2:#ff5f5f;
    --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15.5px/1.8 -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;min-height:100vh}
  /* 背景：静态网格 + 灰白光晕 + 单色光粒 */
  .gridbg{position:fixed;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 78%);
            mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 78%);}
  .orb{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none}
  .orb.a{width:560px;height:560px;top:-200px;left:-140px;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%)}
  .orb.b{width:480px;height:480px;top:-120px;right:-160px;background:radial-gradient(circle,rgba(255,255,255,.05),transparent 70%)}
  canvas#fbg{position:fixed;inset:0;pointer-events:none}
  .wrap{position:relative;max-width:900px;margin:0 auto;padding:0 24px}
  /* 山门 */
  nav{display:flex;align-items:center;gap:4px;padding:26px 0 10px;font-family:var(--mono)}
  .logo{font-size:16px;font-weight:800;letter-spacing:4px;color:var(--ink);text-decoration:none}
  .logo b{color:var(--muted);font-weight:600}
  .logo i{font-style:normal;color:var(--red)}
  nav .sp{flex:1}
  nav a.lk{color:var(--ink2);text-decoration:none;font-size:13px;padding:5px 13px;border-radius:999px;border:1px solid transparent;letter-spacing:1px;transition:.2s}
  nav a.lk:hover{color:var(--ink);border-color:var(--line2)}
  nav .tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-family:var(--mono)}
  /* 题字 */
  header{padding:22vh 0 6vh}
  h1{font-size:clamp(40px,9vw,76px);font-weight:900;letter-spacing:10px;line-height:1.1;color:var(--ink)}
  .sub{margin-top:22px;color:var(--ink2);font-size:15px;letter-spacing:2px}
  .typed{margin-top:38px;min-height:1.9em;color:var(--muted);font-size:13.5px;letter-spacing:3px;font-family:var(--mono)}
  .typed .caret{display:inline-block;width:.5em;height:1.05em;margin-left:2px;background:var(--red);vertical-align:-.15em;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  /* 页脚 */
  footer{margin-top:18vh;padding-bottom:44px;color:var(--muted);font-size:12px;font-family:var(--mono);line-height:2.3;text-align:center}
  footer .st{color:var(--ink2)}
  footer .st i{font-style:normal;color:var(--red)}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--ink)}
  .corner{display:inline-block;font-size:11.5px;opacity:.4;letter-spacing:5px;transition:.3s;margin-top:6px}
  .corner:hover{opacity:1;color:var(--red2);text-shadow:0 0 18px rgba(230,69,69,.55)}
  @media(max-height:560px){header{padding:12vh 0 5vh}footer{margin-top:6vh}}
</style>
</head>
<body>
<div class="gridbg"></div>
<div class="orb a"></div><div class="orb b"></div>
<canvas id="fbg"></canvas>

<div class="wrap">
  <nav>
    <a class="logo" href="index.html">灵台<i>·</i>方寸间</a>
    <span class="sp"></span>
    <a class="lk" href="posts/">见闻录</a>
    <a class="lk" href="posts/barbell-playbook.html">灵蕴</a>
    <a class="lk" href="photos.html">影神图</a>
    <a class="lk" href="daily-ops.md">执行文档</a>
    <span class="tag" id="dateTag"></span>
  </nav>

  <header>
    <h1>灵台</h1>
    <p class="sub">灵台方寸山 · 斜月三星洞。</p>
    <div class="typed"><span id="typedTxt"></span><span class="caret"></span></div>
  </header>

  <footer>
    <div class="st">© 2026 灵台 · GitHub Pages · <i>●</i> 灵山不远</div>
    <a class="corner" href="posts/novel/">· 心猿 ·</a>
  </footer>
</div>

<script>
(function(){
  // —— 单色光粒背景（黑白 + 光粒微光）——
  var cv=document.getElementById('fbg'),ctx=cv.getContext('2d'),w,h;
  var reduced=matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pts=[];
  function rs(){w=cv.width=innerWidth;h=cv.height=innerHeight;}
  rs();addEventListener('resize',rs);
  for(var i=0;i<52;i++)pts.push({
    x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    r:Math.random()*1.6+.5,
    vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.22,
    a:Math.random()*.5+.12,
    w:Math.random()<.14   // 少数更亮的"灵光"
  });
  function tick(){
    ctx.clearRect(0,0,w,h);
    pts.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<-5)p.x=w+5;if(p.x>w+5)p.x=-5;if(p.y<-5)p.y=h+5;if(p.y>h+5)p.y=-5;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);
      ctx.fillStyle=p.w?'rgba(255,255,255,'+(p.a+.2)+')':'rgba(210,210,215,'+p.a+')';
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  if(reduced){ /* 静止一帧 */ ctx.clearRect(0,0,w,h);
    pts.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle='rgba(210,210,215,'+p.a+')';ctx.fill();});
  } else requestAnimationFrame(tick);

  // —— 打字机：六根常清净，非是有心猿。——
  var line='六根常清净，非是有心猿。';
  var el=document.getElementById('typedTxt'),ci=0,del=false;
  (function type(){
    el.textContent=line.slice(0,ci);
    if(!del){ci++;if(ci>line.length){del=true;setTimeout(type,3600);return;}setTimeout(type,150);}
    else{if(ci>0){ci--;setTimeout(type,55);}else{del=false;setTimeout(type,900);}}
  })();

  document.getElementById('dateTag').textContent=new Date().toISOString().slice(0,10).replace(/-/g,'.');
})();
</script>
</body>
</html>
