<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵台 · 方寸间</title>
<meta name="description" content="灵台方寸山，斜月三星洞。见闻录、灵蕴、神通、影神图、心猿。非投资建议。">
<style>
  :root{
    --bg:#080b13; --line:rgba(148,163,184,.16); --line2:rgba(148,163,184,.3);
    --ink:#e5ecf5; --ink2:#96a3b8; --muted:#5b6a80;
    --cy:#22d3ee; --vi:#a78bfa; --tl:#2dd4bf; --rd:#fb7185;
    --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15.5px/1.8 -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;min-height:100vh}
  /* 静态背景：网格 + 两团光晕（无任何动画） */
  .gridbg{position:fixed;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(148,163,184,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.045) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 78%);
            mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 78%);}
  .orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;opacity:.4}
  .orb.a{width:520px;height:520px;top:-180px;left:-120px;background:radial-gradient(circle,rgba(34,211,238,.3),transparent 70%)}
  .orb.b{width:460px;height:460px;top:-100px;right:-140px;background:radial-gradient(circle,rgba(167,139,250,.26),transparent 70%)}
  .wrap{position:relative;max-width:900px;margin:0 auto;padding:0 24px}
  /* 山门（顶部菜单） */
  nav{display:flex;align-items:center;gap:4px;padding:26px 0 10px;font-family:var(--mono)}
  .logo{font-size:16px;font-weight:800;letter-spacing:4px;color:var(--ink);text-decoration:none}
  .logo b{background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  nav .sp{flex:1}
  nav a.lk{color:var(--ink2);text-decoration:none;font-size:13px;padding:5px 13px;border-radius:999px;border:1px solid transparent;letter-spacing:1px;transition:.2s}
  nav a.lk:hover{color:var(--cy);border-color:var(--line2)}
  nav .tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-family:var(--mono)}
  /* 题字区 */
  header{padding:22vh 0 8vh}
  h1{font-size:clamp(40px,9vw,76px);font-weight:900;letter-spacing:10px;line-height:1.1;
     background:linear-gradient(94deg,#fff 12%,var(--cy) 50%,var(--vi) 85%);
     -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{margin-top:22px;color:var(--ink2);font-size:15px;letter-spacing:2px}
  .sub b{color:var(--muted);font-weight:600}
  .line{margin-top:34px;color:var(--muted);font-size:13px;letter-spacing:1px;line-height:2}
  .line i{color:var(--tl);font-style:normal}
  /* 页脚 */
  footer{margin-top:16vh;padding-bottom:40px;color:var(--muted);font-size:12px;font-family:var(--mono);line-height:2.2;text-align:center}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--cy)}
  .corner{display:inline-block;font-size:11.5px;opacity:.4;letter-spacing:5px;transition:.3s;margin-top:6px}
  .corner:hover{opacity:1;color:var(--rd);text-shadow:0 0 18px rgba(251,113,133,.6)}
  @media(max-height:560px){header{padding:12vh 0 6vh}footer{margin-top:6vh}}
</style>
</head>
<body>
<div class="gridbg"></div>
<div class="orb a"></div><div class="orb b"></div>

<div class="wrap">
  <nav>
    <a class="logo" href="index.html">灵台<b>·方寸间</b></a>
    <span class="sp"></span>
    <a class="lk" href="posts/">见闻录</a>
    <a class="lk" href="posts/barbell-playbook.html">灵蕴</a>
    <a class="lk" href="photos.html">影神图</a>
    <a class="lk" href="daily-ops.md">执行文档</a>
    <span class="tag" id="dateTag"></span>
  </nav>

  <header>
    <h1>灵台</h1>
    <p class="sub">灵台方寸山 · 斜月三星洞 —— <b>一座收念头的山门。</b></p>
    <div class="line">
      以见闻记行脚，以数据勘灵蕴，以神通安身，以影神图存刹那。<br>
      <i>六根常清净，非是有心猿。</i>
    </div>
  </header>

  <footer>
    <div>© 2026 灵台 · GitHub Pages · <span style="color:var(--tl)">● 灵山不远</span></div>
    <div>免责：灵蕴板块为个人策略笔记，非投资建议 · 数据以交易所公告为准</div>
    <a class="corner" href="posts/novel/">· 心猿 ·</a>
  </footer>
</div>

<script>
  document.getElementById('dateTag').textContent = new Date().toISOString().slice(0,10).replace(/-/g,'.');
</script>
</body>
</html>
