<!DOCTYPE html>

<head>

<title>一个角落 · 手记</title>
<meta name="robots" content="noindex">
<style>
  :root{ --bg:#fbfaf7; --card:#fffdf8; --border:#e9e4d8; --ink:#3d3730; --ink2:#6f6759; --muted:#a89f8e; --chip:#f4f0e6; --shadow:0 1px 2px rgba(61,55,48,.05),0 4px 16px rgba(61,55,48,.06); }
  @media (prefers-color-scheme:dark){ :root{ --bg:#191713; --card:#221f19; --border:#383227; --ink:#e8e2d6; --ink2:#b5ab97; --muted:#7d7462; --chip:#2a261e; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);} }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:16px/2 "Songti SC","STSong","SimSun","Noto Serif SC",serif}
  .wrap{max-width:620px;margin:0 auto;padding:0 20px 70px}
  .top{display:flex;justify-content:space-between;align-items:center;padding:30px 0 8px;font-size:12px;color:var(--muted);letter-spacing:2px}
  .top a{color:var(--muted);text-decoration:none}
  .top a:hover{color:var(--ink2)}
  h1{font-size:22px;font-weight:600;letter-spacing:6px;padding:16px 0 4px}
  .d{color:var(--muted);font-size:12.5px;margin-bottom:26px;letter-spacing:1px}
  .note{color:var(--ink2);font-size:14px;margin-bottom:26px;border-left:2px solid var(--border);padding-left:14px}
  .chaps{list-style:none}
  .chaps li{padding:13px 2px;border-bottom:1px dashed var(--border);font-size:15px}
  .chaps li a{color:var(--ink);text-decoration:none}
  .chaps li a:hover{text-decoration:underline}
  .chaps .st{font-size:12px;color:var(--muted);margin-left:10px}
  .chaps .no{display:inline-block;width:44px;color:var(--muted)}
  .log{margin-top:30px;font-size:12.5px;color:var(--muted);line-height:2}
  footer{margin-top:34px;font-size:11.5px;color:var(--muted);letter-spacing:1px}
  /* 更新记录格式：YYYY-MM-DD —— 事件。新章：posts/novel/chapter-NNN.html 复制 chapter-001 样式 */
</style>
</head>
<body>
<div class="wrap">

  <ul class="chaps">

    <li><span class="st">（尚未更新 · 建此页以占位）</span></li>

  <footer>· 连载存档 · 只写给自己 ·</footer>
</div>
