<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>见闻录 · 灵台</title>
<style>
  :root{
    --bg:#080b13; --panel:rgba(17,24,39,.72); --line:rgba(148,163,184,.16); --line2:rgba(148,163,184,.32);
    --ink:#e5ecf5; --ink2:#96a3b8; --muted:#5b6a80; --cy:#e8e8e8; --vi:#a3a3a3; --tl:#ff5f5f;
    --glow:0 0 22px rgba(255,255,255,.2); --shadow:0 10px 40px rgba(0,0,0,.5);
    --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
  .gridbg{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(148,163,184,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.045) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 78%)}
  .wrap{position:relative;max-width:780px;margin:0 auto;padding:0 22px 70px}
  .top{display:flex;justify-content:space-between;align-items:center;padding:24px 0 6px;font-size:13px;font-family:var(--mono)}
  .top a{color:var(--muted);text-decoration:none}
  .top a:hover{color:var(--cy)}
  .top .s{color:var(--tl)}
  h1{font-size:28px;font-weight:900;padding:14px 0 4px;letter-spacing:6px;background:linear-gradient(92deg,#fff 20%,var(--cy) 60%,var(--vi));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .d{color:var(--muted);font-size:12.5px;font-family:var(--mono);margin-bottom:20px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 20px}
  .filters button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 18px;font-size:13px;color:var(--ink2);cursor:pointer;font-family:inherit;letter-spacing:2px;transition:.2s}
  .filters button:hover{color:var(--cy);border-color:var(--line2)}
  .filters button.on{color:#0a0a0a;background:#e8e8e8;border-color:transparent;font-weight:700}
  .card{position:relative;display:block;text-decoration:none;color:inherit;margin-bottom:14px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:20px 22px;transition:.22s}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--cy),var(--vi));opacity:.45;transition:.22s}
  .card:hover{border-color:var(--line2);box-shadow:var(--glow),var(--shadow)}
  .card:hover::before{opacity:1;width:5px}
  .card h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:1px}
  .card .d{color:var(--muted);font-size:12px;font-family:var(--mono);margin:5px 0 7px}
  .card p{color:var(--ink2);font-size:13.5px}
  .tags{margin-top:10px}
  .tags span{display:inline-block;font-size:11px;color:var(--ink2);background:rgba(148,163,184,.1);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-right:6px;font-family:var(--mono)}
  .c-cat{font-size:10.5px;font-weight:800;letter-spacing:2px;border-radius:6px;padding:3px 9px;flex:none;font-family:var(--mono)}
  .c-日常{color:#e8e8e8;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22)}
  .c-投资{color:#ff6b6b;background:rgba(230,69,69,.1);border:1px solid rgba(230,69,69,.4)}
  .c-技能{color:#e8e8e8;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22)}
  .c-相册{color:#e8e8e8;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22)}
  .empty{margin:22px 0;color:var(--muted);font-size:13px;font-family:var(--mono)}
  .foot{margin-top:30px;color:var(--muted);font-size:12px;font-family:var(--mono);line-height:2}
</style>
</head>
<body>
<div class="gridbg"></div>
<div class="wrap">
  <div class="top"><a href="../index.html">‹ 山门</a><span class="s">● 见闻录</span></div>
  <h1>见闻录</h1>
  <div class="d">一路所见 · 一并所记</div>
  <div class="filters" id="filters">
    <button data-c="全部" class="on">全部</button>
    <button data-c="日常">行脚</button>
    <button data-c="投资">灵蕴</button>
    <button data-c="技能">神通</button>
    <button data-c="相册">影神</button>
  </div>
  <div id="list"></div>
  <div class="empty" id="empty" hidden>// 此去无物——先留白，等想写的那天。</div>
  <div class="foot"># 行脚记日常 · 灵蕴附数据 · 神通须能跑 · 影神存刹那</div>
</div>

<script>
var POSTS=[
  {t:'哑铃执行看板 · 三段论操作手册', d:'2026-09-03', c:'投资', h:'barbell-playbook.html',
   x:'三段论框架 + 两轴一禁：三类资产对号入座 → 现状/目标/理想三档配比 → 13 项可输入的位置仪表 → 信号触发与执行时间轴。含 1y/3y/5y 三窗口实证。',
   tags:['strategy','dataviz','interactive']},
  {t:'灵台初筑：为什么是"灵台"', d:'2026-09-03', c:'日常', h:'daily/2026-09-03-hello.html',
   x:'建站第一天。定下三条规矩：写给自己优先、结论附数据、公开版不含任何个人真实信息。',
   tags:['meta']},
  {t:'影神图 · 图片存档', d:'2026-09-03', c:'相册', h:'../photos.html',
   x:'照片上架位。等第一批图进来，这里会变成一堵安静的墙。',
   tags:['photos']},
];
var CATNAME={'日常':'行脚','投资':'灵蕴','技能':'神通','相册':'影神'};
var list=document.getElementById('list'),empty=document.getElementById('empty');
function render(cat){
  var items=POSTS.filter(function(p){return cat==='全部'||p.c===cat;});
  empty.hidden=items.length>0;
  list.innerHTML=items.map(function(p){
    return '<a class="card" href="'+p.h+'">'
      +'<h2><span class="c-cat c-'+p.c+'">'+(CATNAME[p.c]||p.c)+'</span>'+p.t+'</h2>'
      +'<div class="d">'+p.d+'</div><p>'+p.x+'</p>'
      +'<div class="tags">'+p.tags.map(function(t){return '<span>'+t+'</span>';}).join('')+'</div></a>';
  }).join('');
}
document.getElementById('filters').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#filters button').forEach(function(x){x.classList.toggle('on',x===b);});
  render(b.dataset.c);
});
render('全部');
</script>
</body>
</html>
