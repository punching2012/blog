<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影神图 · 灵台</title>
<style>
  :root{
    --bg:#080b13; --panel:rgba(17,24,39,.72); --line:rgba(148,163,184,.16); --line2:rgba(148,163,184,.32);
    --ink:#e5ecf5; --ink2:#96a3b8; --muted:#5b6a80; --cy:#e8e8e8; --vi:#a3a3a3; --tl:#ff5f5f;
    --glow:0 0 22px rgba(255,255,255,.2); --shadow:0 10px 40px rgba(0,0,0,.5);
    --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15.5px/1.7 -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
  .gridbg{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.05) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 75%)}
  .wrap{position:relative;max-width:1000px;margin:0 auto;padding:0 22px 70px}
  .top{display:flex;justify-content:space-between;align-items:center;padding:24px 0 6px;font-size:13px;font-family:var(--mono)}
  .top a{color:var(--muted);text-decoration:none}
  .top a:hover{color:var(--cy)}
  .top .s{color:var(--tl)}
  h1{font-size:30px;font-weight:900;padding:16px 0 4px;letter-spacing:3px;background:linear-gradient(92deg,#fff 20%,var(--cy) 60%,var(--vi));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .d{color:var(--muted);font-size:12.5px;font-family:var(--mono);margin-bottom:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .slot{aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;gap:5px;font-family:var(--mono)}
  .slot b{color:var(--line2);font-weight:600}
  .slot:nth-child(3n):hover,.slot:hover{border-color:var(--cy);box-shadow:var(--glow)}
  .note{margin-top:22px;color:var(--muted);font-size:12.5px;line-height:2;font-family:var(--mono)}
  .note b{color:var(--cy)}
</style>
</head>
<body>
<div class="gridbg"></div>
<div class="wrap">
  <div class="top"><a href="index.html">‹ cd ..</a><span class="s">● 影神图</span></div>
  <h1>影神图</h1>
  <div class="d">2026-09-03 built · 影神存档 · 目前还是空墙</div>
  <div class="grid">
    <div class="slot"><b>▦ 待上传</b>slot 01</div>
    <div class="slot"><b>▦ 待上传</b>slot 02</div>
    <div class="slot"><b>▦ 待上传</b>slot 03</div>
    <div class="slot"><b>▦ 待上传</b>slot 04</div>
    <div class="slot"><b>▦ 待上传</b>slot 05</div>
    <div class="slot"><b>▦ 待上传</b>slot 06</div>
  </div>
  <p class="note"># 上传规则：图片 ≤1MB 放 <b>photos/</b>，在 .grid 里加一行 &lt;figure&gt; 即可（见源码注释）。<br># 照片按"时间 × 地点 × 一句话"存放：不追求整齐，只追求再看时能想起当时为什么按下快门。</p>
</div>
</body>
</html>
